<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Dota WC3 — Build Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,500..700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=203">
  <!-- Motyw First Blood Gaming. Nakladka na style.css: nadpisuje tokeny z :root
       i te miejsca, gdzie kolor albo kroj byl wpisany na sztywno. Musi zostac
       ponizej style.css, bo caly dziala na kolejnosci. -->
  <link rel="stylesheet" href="theme-fbg.css?v=44">
</head>
<body>
  <header>
    <h1>Mini-Dota<span class="wordmark-sub">WC3</span></h1>
    <nav>
      <button class="nav-btn active" data-tab="heroes">Heroes</button>
      <button class="nav-btn" data-tab="items">Items</button>
      <button class="nav-btn" data-tab="mercs">Mercenaries</button>
      <button class="nav-btn" data-tab="structures">Towers &amp; Bases</button>
      <button class="nav-btn" data-tab="campaign-items">Campaign Items</button>
      <!-- Hidden, not deleted: app.js reads TAB_NAMES off these buttons and
           clicks the Builds one by selector after a build is saved, so removing
           them from the markup would throw. style.css hides the pair. -->
      <button class="nav-btn" data-tab="builds">Builds</button>
      <button class="nav-btn" data-tab="build-creator">Create Build</button>
    </nav>
  </header>

  <main>
    <!-- HEROES TAB -->
    <section id="tab-heroes" class="tab active">
      <div class="search-bar">
        <input type="text" id="hero-search" placeholder="Search heroes...">
        <select id="hero-filter-stat">
          <option value="">All Stats</option>
          <option value="STR">Strength</option>
          <option value="AGI">Agility</option>
          <option value="INT">Intelligence</option>
        </select>
        <select id="hero-filter-role">
          <option value="">All Roles</option>
        </select>
      </div>
      <div id="hero-list" class="card-grid"></div>
    </section>

    <!-- ITEMS TAB -->
    <section id="tab-items" class="tab">
      <div class="search-bar">
        <input type="text" id="item-search" placeholder="Search items...">
        <select id="item-filter-cat">
          <option value="">All Shops</option>
          <option value="Consumable">Consumables</option>
          <option value="Special">Special</option>
          <option value="Upgradable">Upgradable</option>
          <option value="Orb">Orbs</option>
          <option value="Advanced">Advanced</option>
          <option value="Black Market">Black Market</option>
          <option value="Goblin Laboratory">Goblin Laboratory</option>
          <option value="Summon">Summons</option>
          <option value="Library">Library</option>
        </select>
      </div>
      <div id="item-list"></div>
    </section>

    <!-- MERCENARIES TAB -->
    <section id="tab-mercs" class="tab">
      <div class="search-bar">
        <input type="text" id="merc-search" placeholder="Search mercenaries...">
      </div>
      <div id="merc-list"></div>
    </section>

    <!-- TOWERS & BASES TAB -->
    <section id="tab-structures" class="tab">
      <div class="search-bar">
        <input type="text" id="structure-search" placeholder="Search towers and bases...">
        <select id="structure-filter-team">
          <option value="">Both Teams</option>
          <option value="Human">Human</option>
          <option value="Undead">Undead</option>
        </select>
      </div>
      <div id="structure-list"></div>
    </section>

    <!-- CAMPAIGN ITEMS TAB
         The 365 items patch 3.0's Rebirth campaign added to the base game.
         Grouped by the equipment slot the game names in each tooltip, with the
         rarity as a second filter, since that is how the campaign sorts them. -->
    <section id="tab-campaign-items" class="tab">
      <div class="search-bar">
        <input type="text" id="citem-search" placeholder="Search campaign items...">
        <select id="citem-filter-cat">
          <option value="">All Types</option>
          <option value="Primary Weapon">Primary Weapons</option>
          <option value="Secondary Weapon">Secondary Weapons</option>
          <option value="Helm">Helms</option>
          <option value="Armor">Armor</option>
          <option value="Gloves">Gloves</option>
          <option value="Boots">Boots</option>
          <option value="Accessory">Accessories</option>
          <option value="Trinket">Trinkets</option>
          <option value="Consumable">Consumables</option>
          <option value="Quest Item">Quest Items</option>
          <option value="Miscellaneous">Miscellaneous</option>
        </select>
        <select id="citem-filter-rarity">
          <option value="">All Rarities</option>
          <option value="Common">Common</option>
          <option value="Uncommon">Uncommon</option>
          <option value="Rare">Rare</option>
          <option value="Epic">Epic</option>
          <option value="Legendary">Legendary</option>
        </select>
      </div>
      <div id="citem-list"></div>
    </section>

    <!-- BUILDS TAB -->
    <section id="tab-builds" class="tab">
      <div class="search-bar">
        <input type="text" id="build-search" placeholder="Search builds...">
      </div>
      <div id="build-list" class="card-grid"></div>
    </section>

    <!-- BUILD CREATOR TAB -->
    <section id="tab-build-creator" class="tab">
      <div class="build-creator">
        <h2>Create New Build</h2>
        <div class="creator-form">
          <div class="form-row">
            <label>Build Name</label>
            <input type="text" id="bc-name" placeholder="e.g. Blink-Blade Build">
          </div>
          <div class="form-row">
            <label>Your Name</label>
            <input type="text" id="bc-author" placeholder="e.g. PlayerName (optional)">
          </div>
          <div class="form-row">
            <label>Hero</label>
            <select id="bc-hero">
              <option value="">Select hero...</option>
            </select>
          </div>

          <div id="bc-skillorder-section" class="form-row hidden">
            <label class="phase-label" style="color:var(--gold-light); margin-bottom:10px;">Skill Order (Level 1–25)</label>
            <div id="bc-skillorder-grid" class="skillorder-grid"></div>
            <div class="skillorder-hint">Click to assign · click again to remove · at most 6 ranks per skill</div>
          </div>

          <div class="form-row phase-section">
            <label class="phase-label phase-label-firstbuy">First Buy</label>
            <div id="bc-slots-firstbuy" class="item-slots" data-phase="firstbuy">
              <div class="item-slot empty" data-slot="0">+</div>
              <div class="item-slot empty" data-slot="1">+</div>
              <div class="item-slot empty" data-slot="2">+</div>
              <div class="item-slot empty" data-slot="3">+</div>
              <div class="item-slot empty" data-slot="4">+</div>
              <div class="item-slot empty" data-slot="5">+</div>
            </div>
          </div>

          <div class="form-row phase-section">
            <label class="phase-label phase-label-midgame">Midgame</label>
            <div id="bc-slots-midgame" class="item-slots" data-phase="midgame">
              <div class="item-slot empty" data-slot="0">+</div>
              <div class="item-slot empty" data-slot="1">+</div>
              <div class="item-slot empty" data-slot="2">+</div>
              <div class="item-slot empty" data-slot="3">+</div>
              <div class="item-slot empty" data-slot="4">+</div>
              <div class="item-slot empty" data-slot="5">+</div>
            </div>
          </div>

          <div class="form-row phase-section">
            <label class="phase-label phase-label-endgame">Endgame</label>
            <div id="bc-slots-endgame" class="item-slots" data-phase="endgame">
              <div class="item-slot empty" data-slot="0">+</div>
              <div class="item-slot empty" data-slot="1">+</div>
              <div class="item-slot empty" data-slot="2">+</div>
              <div class="item-slot empty" data-slot="3">+</div>
              <div class="item-slot empty" data-slot="4">+</div>
              <div class="item-slot empty" data-slot="5">+</div>
            </div>
            <div class="legendary-row">
              <span class="legendary-row-label">Legendary Replacement (optional — which Endgame item does it replace?)</span>
              <div id="bc-slots-legendary" class="item-slots" data-phase="legendary">
                <div class="item-slot legendary-slot empty" data-slot="0">—</div>
                <div class="item-slot legendary-slot empty" data-slot="1">—</div>
                <div class="item-slot legendary-slot empty" data-slot="2">—</div>
                <div class="item-slot legendary-slot empty" data-slot="3">—</div>
                <div class="item-slot legendary-slot empty" data-slot="4">—</div>
                <div class="item-slot legendary-slot empty" data-slot="5">—</div>
              </div>
            </div>
          </div>

          <div id="bc-item-picker" class="item-picker hidden">
            <input type="text" id="bc-item-search" placeholder="Search items...">
            <div id="bc-item-picker-list"></div>
          </div>

          <div class="form-row">
            <label>Tags</label>
            <div id="bc-tags-container" class="tags-selector"></div>
          </div>
          <div class="form-row">
            <label>Notes</label>
            <textarea id="bc-notes" rows="4" placeholder="Build order, strategy, tips..."></textarea>
          </div>
          <button id="bc-save" class="btn-primary">Save Build</button>
        </div>
        <div id="bc-preview" class="build-preview hidden">
          <h3>Preview</h3>
          <div id="bc-preview-content"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js?v=214"></script>
</body>
</html>
